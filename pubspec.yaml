name: geoharvest
description: "GeoHarvest AI - Voice-first agricultural marketplace for Ghanaian farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2
  get_it: ^7.6.0

  # Voice & Audio
  record: ^5.0.4
  audioplayers: ^5.2.1
  permission_handler: ^11.3.1

  # Networking
  http: ^1.2.2
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0

  # UI
  flutter_svg: ^2.0.9
  lottie: ^3.1.0
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Logging & Error Handling
  logger: ^2.4.0
  sentry_flutter: ^7.15.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.1.0
  equatable: ^2.0.5

  # AI/Chat
  google_generative_ai: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

name: geoharvest
description: "GeoHarvest AI - Voice-first agricultural marketplace for Ghanaian farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Voice
  record: ^5.0.4
  audioplayers: ^5.2.1
  permission_handler: ^11.3.1

  # Networking — single backend HTTP client (Dio); http kept for GhanaNLP voice provider
  dio: ^5.4.0
  http: ^1.2.2

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Maps (planned GeoHarvest feature)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0

  # UI
  flutter_svg: ^2.0.9
  lottie: ^3.1.0

  # Utilities
  equatable: ^2.0.5
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
